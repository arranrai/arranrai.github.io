<!doctype html>
<html lang="en">
<head>
  <!--
    🎯 GOAL: A clean, single‑page personal website like wongmjane.com
    You can learn HTML/CSS by tweaking this one file. Open it in a browser.

    HOW TO USE THIS FILE
    1) Replace placeholder text (Your Name, City, links, email).
    2) Save as index.html and open in a browser (double‑click the file).
    3) Add an image named avatar.jpg next to this file for the photo.
    4) When you're happy, deploy via GitHub Pages (see steps in chat).
  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arran Rai — Aerospace Graduate</title>
  <meta name="description" content="Arran Rai, Aerospace Engineering graduate pivoting into software and data, passionate about coding and technology." />
  <!-- Optional: social sharing cards (edit or remove) -->
  <meta property="og:title" content="Arran Rai" />
  <meta property="og:description" content="Aerospace Engineering graduate passionate about coding, robotics, and data-driven innovation." />
  <meta property="og:type" content="website" />
  <!-- 👇 Add your hosted image URL once live (e.g., https://yourusername.github.io/avatar.jpg) -->
  <meta property="og:image" content="https://arranrai.github.io/avatar.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <style>
    /* === Basic reset + theme tokens === */
    :root {
      --maxw: 720px;          /* content width */
      --pad: 24px;            /* page padding */
      --radius: 999px;        /* round avatar */
      --text: #111;           /* text color (light) */
      --bg: #fff;             /* background (light) */
      --muted: #555;          /* secondary text */
      --link: currentColor;   /* link inherits current text color */
    }
    @media (prefers-color-scheme: dark) {
      :root { --text:#eee; --bg:#0b0b0b; --muted:#aaa; }
    }

    html, body { height: 100%; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      place-items: center;   /* centers the main card */
    }

    /* === Layout === */
    main {
      width: min(100%, var(--maxw));
      padding: var(--pad);
    }

    header { margin: 0 0 8px 0; }
    h1 { font-size: 28px; line-height: 1.2; margin: 12px 0 4px; }
    .sub { margin: 0; color: var(--muted); }

    /* === Avatar image === */
    .avatar {
      width: 96px; height: 96px; border-radius: var(--radius);
      object-fit: cover; display: block;
    }

    /* === Links list === */
    nav ul {
      list-style: none; padding: 0; margin: 16px 0 0 0;
      display: flex; flex-wrap: wrap; gap: 12px 16px;
    }
    nav a {
      text-decoration: none;
      border-bottom: 1px solid currentColor; /* subtle underline */
    }
    nav a:focus-visible { outline: 2px dashed; outline-offset: 2px; }

    /* === Footer === */
    footer { margin-top: 24px; color: var(--muted); font-size: 14px; }

    /* Optional: a simple content block you can use later */
    .block { margin-top: 24px; }

    /*-- ----- START OF CSS DARK/LIGHT THEME CODE ----------------- */
    :root {
      /* DEFAULT VALUES FOR LIGHT THEME */
      --bg-color: #fff;
      --text-color: #000;
      --link-color: #0066cc;
      --border-color: #ddd;
    }

    /* DEFAULT VALUES FOR DARK THEME */
    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --text-color: #e0e0e0;
      --link-color: #66b3ff;
      --border-color: #444;
    }

    /* Applying the colour values to variables on webpage */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  
    a {
      color: var(--link-color); /* Applying the link colour value to be set to the corresponding theme */
    }

    /* Setting up the COLOUR THEME BUTTON */
    .theme-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.3s ease;
      z-index: 1000;
    }
  
    .theme-toggle:hover {
      /* opacity: 0.8; */
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    /* ----- END OF CSS DARK/LIGHT THEME CODE ----------------- */
    
  </style>
</head>

<body>
  <!--
    SEMANTIC STRUCTURE
    - <header>: your identity
    - <nav>: key links
    - <main>: the main content (we keep it very small/minimal)
    - <footer>: small print
  -->

  <!-- Creates a button using defined "theme-toggle" above, gives it a uniqueID "themeToggle" and initial text is "Dark" --!>
  <button class="theme-toggle" id="themeToggle">Dark</button> 
  
  <main class="page">
    <header>
      <!-- Put avatar.jpg next to this file. If you don't want a photo, delete the <img>. -->
      <img src="avatar.jpg" alt="Portrait of Arran Rai" class="avatar" />
      <h1>Arran Rai</h1>
      <p class="sub">Leicester, UK · Aerospace Graduate</p>
    </header>

    <nav aria-label="Primary">
      <ul>
        <!--
          TIP: change link text and href values. Keep mailto for email.
          If you want links to open in a new tab, add: target="_blank" rel="noopener noreferrer"
        -->
        <li><a href="mailto: arranrai1904@gmail.com">Email</a></li>
        <li><a href="https://www.linkedin.com/in/arran-rai/">LinkedIn</a></li>
        <li><a href="https://github.com/arranrai">GitHub</a></li>
   <!-- <li><a href="https://www.youtube.com/c/arran1904">Youtube</a></li> -->
        <li><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Blog(TBD)</a></li>
        <!-- Add or remove links as you like -->
      </ul>
    </nav>

    <!-- Optional content block (start with just a sentence) -->
    <section class="block" aria-label="About">
      <p>
        👋 Hello! I'm <strong>Arran</strong>. I enjoy building things, and I'm currently learning 
        web development. This site is intentionally minimal and fast, kachow.
      </p>
    </section>

    <!--
      More optional blocks you can enable later:

    <section class="block" aria-label="Projects">
      <h2>Projects</h2>
      <ul>
        <li><a href="#">Project One</a> — one‑line description.</li>
        <li><a href="#">Project Two</a> — one‑line description.</li>
      </ul>
    </section>

    <section class="block" aria-label="Writing">
      <h2>Writing</h2>
      <p>Move your posts to a separate blog and link them above to keep this page simple.</p>
    </section>

    -->

    <footer>
      <small>
        © <span id="year">2025</span> Arran Rai • Last updated 
        <time id="updated" datetime="2025-09-29">Sep 29, 2025</time>
        (<span id="daysago"></span> days ago).
      </small>
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const updatedEl = document.getElementById('updated');
    const updatedDate = new Date(updatedEl.dateTime);
    const today = new Date();
    const diffTime = today - updatedDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    document.getElementById('daysago').textContent = diffDays;
  </script>

  
  <script> 
    /* ----- START OF JSS DARK/LIGHT THEME CODE ----------------- */
    const themeToggle = document.getElementById('themeToggle'); // Used to assign theme toggle button uniqueID set above to a var
    const html = document.documentElement; // Creates a html element
  
    // Check for saved theme preference from last visit or default to light
    const currentTheme = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', currentTheme);
    themeToggle.textContent = currentTheme === 'dark' ? 'Light' : 'Dark'; // Sets the text based on the current theme, if
    //theme is light, text will read dark and vice versa using shorthand if else
  
    // IMPLEMENT BUTTON CLICK FUNTIONALITY
    themeToggle.addEventListener('click', () => {      // When button is clicked....
      const theme = html.getAttribute('data-theme');   // get current theme and store in variable theme
      const newTheme = theme === 'dark' ? 'light' : 'dark';    // sets newTheme to be opposite to current theme
      
      html.setAttribute('data-theme', newTheme);  // Changes html data theme to the new theme, changing website colours
      localStorage.setItem('theme', newTheme);    // Changes the theme in local storage for local saving theme
      themeToggle.textContent = newTheme === 'dark' ? 'Light' : 'Dark';    // Changes the text in the button when button is clicked
    });
    /*- ----- END OF JSS DARK/LIGHT THEME CODE ----------------- */
  </script>
  
</body>
</html>
